name: guides-and-packages

on:
  pull_request:
    paths:
      - ".github/workflows/guides.yml"
      - "families/**"
      - "models/*.html"
      - "community/**"
      - "data/**"
      - "experiments/**"
      - "model-intake/**"
      - "patches/**"
      - "packages/**"
      - "repro/**"
      - "results/**"
      - "README.md"
      - "index.html"
      - "guides.html"
      - "learn.html"
      - "learn/**"
      - "tools/build-family-pages.py"
      - "tools/build-model-pages.py"
      - "tools/test_build_family_pages.py"
      - "tools/test_measured_opt_contract.py"
      - "tools/validate-repro-guides.py"
      - "tools/test_validate_repro_guides.py"
      - "tools/sync-depth-sweep-profiles.py"
      - "tools/test_sync_depth_sweep_profiles.py"
      - "tools/sync-public-result-summary.py"
      - "tools/test_sync_public_result_summary.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/guides.yml"
      - "families/**"
      - "models/*.html"
      - "community/**"
      - "data/**"
      - "experiments/**"
      - "model-intake/**"
      - "patches/**"
      - "packages/**"
      - "repro/**"
      - "results/**"
      - "README.md"
      - "index.html"
      - "guides.html"
      - "learn.html"
      - "learn/**"
      - "tools/build-family-pages.py"
      - "tools/build-model-pages.py"
      - "tools/test_build_family_pages.py"
      - "tools/test_measured_opt_contract.py"
      - "tools/validate-repro-guides.py"
      - "tools/test_validate_repro_guides.py"
      - "tools/sync-depth-sweep-profiles.py"
      - "tools/test_sync_depth_sweep_profiles.py"
      - "tools/sync-public-result-summary.py"
      - "tools/test_sync_public_result_summary.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate-repro-guides.py
      - run: python3 -m unittest tools/test_validate_repro_guides.py tools/test_sync_depth_sweep_profiles.py
      - run: python3 tools/sync-public-result-summary.py --check
      - run: python3 -m unittest tools/test_sync_public_result_summary.py
      - run: python3 tools/build-family-pages.py --check
      - run: python3 -m unittest tools/test_build_family_pages.py
      - run: python3 -m unittest tools/test_measured_opt_contract.py
      - run: python3 tools/build-model-pages.py
      - run: git diff --exit-code -- index.html learn/hardware.html models
