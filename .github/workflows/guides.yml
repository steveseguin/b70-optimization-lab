name: guides-and-packages

on:
  pull_request:
    paths:
      - ".github/workflows/guides.yml"
      - "families/**"
      - "models/*.html"
      - "community/**"
      - "data/**"
      - "experiments/**"
      - "model-intake/**"
      - "patches/**"
      - "packages/**"
      - "repro/**"
      - "results/**"
      - "README.md"
      - "index.html"
      - "guides.html"
      - "learn.html"
      - "learn/**"
      - "tools/build-family-pages.py"
      - "tools/build-model-pages.py"
      - "tools/test_build_model_pages.py"
      - "tools/sync-short-prefill-profiles.py"
      - "tools/sync-prefill-followup-profiles.py"
      - "tools/sync-fp8-prefill-focus-profile.py"
      - "tools/test_sync_fp8_prefill_focus_profile.py"
      - "tools/test_sync_prefill_followup_profiles.py"
      - "tools/test_build_family_pages.py"
      - "tools/test_guides_browser.cjs"
      - "tools/test_measured_opt_contract.py"
      - "tools/validate-repro-guides.py"
      - "tools/test_validate_repro_guides.py"
      - "tools/validate-recipe-publication.py"
      - "tools/test_validate_recipe_publication.py"
      - "tools/sync-depth-sweep-profiles.py"
      - "tools/test_sync_depth_sweep_profiles.py"
      - "tools/sync-public-result-summary.py"
      - "tools/test_sync_public_result_summary.py"
      - "tools/check-doc-links.py"
      - "scripts/check-qwen36-xpu-xccl-health.sh"
      - "tools/xccl_probe.py"
      - "tools/test_xccl_probe.py"
      - "tools/test_pr45_gpu_review.py"
      - "tools/check-manifest-paths.py"
      - "tools/container-packet/**"
      - "tools/test_container_packet_smoke.py"
      - "tools/check-container-packet.py"
      - "tools/test_check_container_packet.py"
      - "tools/audit-launcher-env-implemented.py"
      - "tools/test_audit_launcher_env_implemented.py"
      - "tools/test_flash_next_frozen_verifiers.py"
      - "tools/test_flash_next_replay_cleanup.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/guides.yml"
      - "families/**"
      - "models/*.html"
      - "community/**"
      - "data/**"
      - "experiments/**"
      - "model-intake/**"
      - "patches/**"
      - "packages/**"
      - "repro/**"
      - "results/**"
      - "README.md"
      - "index.html"
      - "guides.html"
      - "learn.html"
      - "learn/**"
      - "tools/build-family-pages.py"
      - "tools/build-model-pages.py"
      - "tools/test_build_model_pages.py"
      - "tools/sync-short-prefill-profiles.py"
      - "tools/sync-prefill-followup-profiles.py"
      - "tools/sync-fp8-prefill-focus-profile.py"
      - "tools/test_sync_fp8_prefill_focus_profile.py"
      - "tools/test_sync_prefill_followup_profiles.py"
      - "tools/test_build_family_pages.py"
      - "tools/test_guides_browser.cjs"
      - "tools/test_measured_opt_contract.py"
      - "tools/validate-repro-guides.py"
      - "tools/test_validate_repro_guides.py"
      - "tools/validate-recipe-publication.py"
      - "tools/test_validate_recipe_publication.py"
      - "tools/sync-depth-sweep-profiles.py"
      - "tools/test_sync_depth_sweep_profiles.py"
      - "tools/sync-public-result-summary.py"
      - "tools/test_sync_public_result_summary.py"
      - "tools/check-doc-links.py"
      - "scripts/check-qwen36-xpu-xccl-health.sh"
      - "tools/xccl_probe.py"
      - "tools/test_xccl_probe.py"
      - "tools/test_pr45_gpu_review.py"
      - "tools/check-manifest-paths.py"
      - "tools/container-packet/**"
      - "tools/test_container_packet_smoke.py"
      - "tools/check-container-packet.py"
      - "tools/test_check_container_packet.py"
      - "tools/audit-launcher-env-implemented.py"
      - "tools/test_audit_launcher_env_implemented.py"
      - "tools/test_flash_next_frozen_verifiers.py"
      - "tools/test_flash_next_replay_cleanup.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/validate-repro-guides.py
      - run: node --test tools/test_guides_browser.cjs
      - run: python3 -m unittest tools/test_validate_repro_guides.py tools/test_sync_depth_sweep_profiles.py
      - run: python3 tools/validate-recipe-publication.py
      - run: python3 -m unittest tools/test_validate_recipe_publication.py
      - run: python3 tools/sync-public-result-summary.py --check
      - run: python3 -m unittest tools/test_sync_public_result_summary.py
      - run: python3 tools/build-family-pages.py --check
      - run: python3 -m unittest tools/test_build_family_pages.py
      - run: python3 -m unittest tools/test_measured_opt_contract.py
      - run: python3 tools/sync-short-prefill-profiles.py --check
      - run: python3 experiments/qwen38-27b-b70/scripts/verify-prefill-followup-evidence.py
      - run: python3 tools/sync-prefill-followup-profiles.py --check
      - run: python3 experiments/qwen38-27b-b70/scripts/verify-fp8-prefill-evidence.py
      - run: python3 tools/sync-fp8-prefill-focus-profile.py --check
      - run: python3 -m unittest tools/test_sync_fp8_prefill_focus_profile.py
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts -p "test_*fp8_prefill*.py"
      - run: python3 -m unittest tools/test_sync_prefill_followup_profiles.py
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts -p "test_*prefill_followup.py"
      - run: python3 -m unittest tools/test_build_model_pages.py
      - run: python3 tools/build-model-pages.py
      - run: git diff --exit-code -- index.html learn/hardware.html models
      # Offline: resolves repository-relative links in the guides and site pages. Publisher-side manifest checking
      # (tools/verify-model-manifests-remote.py) stays manual, since it needs the Hugging Face API and would flake here.
      - run: python3 tools/check-doc-links.py
      - run: python3 -m unittest tools/test_xccl_probe.py
      - run: python3 -m unittest tools/test_pr45_gpu_review.py
      - run: python3 tools/check-manifest-paths.py
      - run: python3 -m unittest tools/test_container_packet_smoke.py
      # Container packets are generated from the recipe launchers. This is the static half of that
      # guarantee: it needs neither the image nor the weights, so it runs here, while regenerating
      # (packages/*/scripts/render-compose.sh) needs both and stays on a lab host.
      - run: pip install --quiet pyyaml
      - run: python3 tools/check-container-packet.py
      - run: python3 -m unittest tools/test_check_container_packet.py
      - run: python3 -m unittest tools/test_audit_launcher_env_implemented.py tools/test_flash_next_frozen_verifiers.py tools/test_flash_next_replay_cleanup.py
