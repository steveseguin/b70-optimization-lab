name: context-evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/context-evidence.yml'
      - 'experiments/qwen38-27b-b70/scripts/context/durable/**'
      - 'experiments/qwen38-27b-b70/scripts/context/evidence/**'
      - 'experiments/qwen38-27b-b70/scripts/context/*durable_host_runner.py'
      - 'experiments/qwen38-27b-b70/data/2026-10-06-durable-context/**'
  pull_request:
    paths:
      - '.github/workflows/context-evidence.yml'
      - 'experiments/qwen38-27b-b70/scripts/context/durable/**'
      - 'experiments/qwen38-27b-b70/scripts/context/evidence/**'
      - 'experiments/qwen38-27b-b70/scripts/context/*durable_host_runner.py'
      - 'experiments/qwen38-27b-b70/data/2026-10-06-durable-context/**'

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context/durable -p 'test_*.py'
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context/evidence -p 'test_*.py'
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context -p 'test_durable_host_runner.py'
      - name: Verify frozen plan without model requests
        run: |
          python3 experiments/qwen38-27b-b70/scripts/context/durable/campaign.py --suite experiments/qwen38-27b-b70/data/2026-10-06-durable-context/holdout/suite.json --out "$RUNNER_TEMP/context-plan"
          python3 - "$RUNNER_TEMP/context-plan/plan.json" experiments/qwen38-27b-b70/data/2026-10-06-durable-context/plan.json <<'PY'
          import json
          import sys
          from pathlib import Path
          # Source enumeration order varies by filesystem; every identity and run
          # must match, but JSON object key order is not part of that identity.
          generated, frozen = (json.loads(Path(p).read_text()) for p in sys.argv[1:])
          if generated != frozen:
              raise SystemExit("Generated plan differs from the frozen experiment identity")
          PY
