name: context-evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/context-evidence.yml'
      - 'experiments/qwen38-27b-b70/scripts/context/durable/**'
      - 'experiments/qwen38-27b-b70/scripts/context/durable_v2/**'
      - 'experiments/qwen38-27b-b70/scripts/context/durable_v3/**'
      - 'experiments/qwen38-27b-b70/scripts/context/durable_v4/**'
      - 'experiments/qwen38-27b-b70/scripts/context/*durable_v4_host_runner.py'
      - 'experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r4/**'
      - 'experiments/qwen38-27b-b70/scripts/context/*durable_v3_host_runner.py'
      - 'experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r3/**'
      - 'experiments/qwen38-27b-b70/scripts/context/*durable_v2_host_runner.py'
      - 'experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r2/**'
      - 'experiments/qwen38-27b-b70/scripts/context/evidence/**'
      - 'experiments/qwen38-27b-b70/scripts/context/*durable_host_runner.py'
      - 'experiments/qwen38-27b-b70/data/2026-10-06-durable-context/**'
  pull_request:
    paths:
      - '.github/workflows/context-evidence.yml'
      - 'experiments/qwen38-27b-b70/scripts/context/durable/**'
      - 'experiments/qwen38-27b-b70/scripts/context/durable_v2/**'
      - 'experiments/qwen38-27b-b70/scripts/context/durable_v3/**'
      - 'experiments/qwen38-27b-b70/scripts/context/durable_v4/**'
      - 'experiments/qwen38-27b-b70/scripts/context/*durable_v4_host_runner.py'
      - 'experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r4/**'
      - 'experiments/qwen38-27b-b70/scripts/context/*durable_v3_host_runner.py'
      - 'experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r3/**'
      - 'experiments/qwen38-27b-b70/scripts/context/*durable_v2_host_runner.py'
      - 'experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r2/**'
      - 'experiments/qwen38-27b-b70/scripts/context/evidence/**'
      - 'experiments/qwen38-27b-b70/scripts/context/*durable_host_runner.py'
      - 'experiments/qwen38-27b-b70/data/2026-10-06-durable-context/**'

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context/durable -p 'test_*.py'
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context/evidence -p 'test_*.py'
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context -p 'test_durable_host_runner.py'
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context/durable_v2 -p 'test_*.py'
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context -p 'test_durable_v2_host_runner.py'
      - name: Verify revision 2 frozen plans without model requests
        run: |
          for stage in development holdout; do
            python3 experiments/qwen38-27b-b70/scripts/context/durable_v2/campaign.py --stage "$stage" --suite "experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r2/$stage/suite.json" --out "$RUNNER_TEMP/context-r2-$stage"
            python3 -c 'import json,sys; from pathlib import Path; assert json.loads(Path(sys.argv[1]).read_text()) == json.loads(Path(sys.argv[2]).read_text())' "$RUNNER_TEMP/context-r2-$stage/plan.json" "experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r2/$stage-plan.json"
          done
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context/durable_v3 -p 'test_*.py'
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context -p 'test_durable_v3_host_runner.py'
      - name: Verify revision 3 frozen plans without model requests
        run: |
          for stage in development holdout; do
            python3 experiments/qwen38-27b-b70/scripts/context/durable_v3/campaign.py --stage "$stage" --suite "experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r3/$stage/suite.json" --out "$RUNNER_TEMP/context-r3-$stage"
            python3 -c 'import json,sys; from pathlib import Path; assert json.loads(Path(sys.argv[1]).read_text()) == json.loads(Path(sys.argv[2]).read_text())' "$RUNNER_TEMP/context-r3-$stage/plan.json" "experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r3/$stage-plan.json"
          done
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context/durable_v4 -p 'test_*.py'
      - run: python3 -m unittest discover -s experiments/qwen38-27b-b70/scripts/context -p 'test_durable_v4_host_runner.py'
      - name: Verify revision 4 frozen plans without model requests
        run: |
          for stage in development holdout; do
            python3 experiments/qwen38-27b-b70/scripts/context/durable_v4/campaign.py --stage "$stage" --suite "experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r4/$stage/suite.json" --out "$RUNNER_TEMP/context-r4-$stage"
            python3 -c 'import json,sys; from pathlib import Path; assert json.loads(Path(sys.argv[1]).read_text()) == json.loads(Path(sys.argv[2]).read_text())' "$RUNNER_TEMP/context-r4-$stage/plan.json" "experiments/qwen38-27b-b70/data/2026-10-07-durable-context-r4/$stage-plan.json"
          done
      - name: Verify frozen plan without model requests
        run: |
          python3 experiments/qwen38-27b-b70/scripts/context/durable/campaign.py --suite experiments/qwen38-27b-b70/data/2026-10-06-durable-context/holdout/suite.json --out "$RUNNER_TEMP/context-plan"
          python3 - "$RUNNER_TEMP/context-plan/plan.json" experiments/qwen38-27b-b70/data/2026-10-06-durable-context/plan.json <<'PY'
          import json
          import sys
          from pathlib import Path
          # Source enumeration order varies by filesystem; every identity and run
          # must match, but JSON object key order is not part of that identity.
          generated, frozen = (json.loads(Path(p).read_text()) for p in sys.argv[1:])
          if generated != frozen:
              raise SystemExit("Generated plan differs from the frozen experiment identity")
          PY
