name: Own engine CPU checks

on:
  push:
    paths:
      - 'experiments/own-xpu-runtime/engine/**'
      - '.github/workflows/own-engine-cpu.yml'
  pull_request:
    paths:
      - 'experiments/own-xpu-runtime/engine/**'
      - '.github/workflows/own-engine-cpu.yml'

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Placement, protocol, evidence and source packaging
        run: |
          python3 -m unittest discover -s experiments/own-xpu-runtime/engine/planning -p 'test_*.py'
          python3 -m unittest discover -s experiments/own-xpu-runtime/engine/tools -p 'test_*.py'
          python3 -m unittest discover -s experiments/own-xpu-runtime/engine/release -p 'test_*.py'
          python3 -m unittest discover -s experiments/own-xpu-runtime/engine/deployment -p 'test_*.py'
      - name: Native stage ownership without device access
        working-directory: experiments/own-xpu-runtime
        run: |
          g++ -std=c++20 -O0 -DOWN_RT_HOST_ONLY -I engine/src engine/planning/test_pipeline_layout.cpp -o /tmp/ownrt-pipeline-layout
          /tmp/ownrt-pipeline-layout gsq-rco-iq3s/loader/placement.tsv
      - name: Native rollback and live draft transport without device access
        working-directory: experiments/own-xpu-runtime
        run: |
          g++ -std=c++20 -O1 -I engine/src engine/planning/test_wavefront.cpp -o /tmp/ownrt-wavefront
          /tmp/ownrt-wavefront
          g++ -std=c++20 -O1 -DOWN_RT_HOST_ONLY -ffunction-sections -fdata-sections -I engine/src engine/planning/test_wavefront_checkpoint.cpp engine/src/stage2/packet194-expert-diet-engine/owner.cpp -Wl,--gc-sections -lcrypto -pthread -o /tmp/ownrt-checkpoint
          /tmp/ownrt-checkpoint /tmp/ownrt-checkpoint-output
          g++ -std=c++20 -O1 -DOWN_RT_HOST_ONLY -ffunction-sections -fdata-sections -I engine/src engine/planning/test_operator_partition.cpp engine/src/stage2/packet194-expert-diet-engine/owner.cpp -Wl,--gc-sections -lcrypto -pthread -o /tmp/ownrt-operator-partition
          /tmp/ownrt-operator-partition /tmp/ownrt-operator-partition-output
          g++ -std=c++20 -O1 -I engine/src engine/planning/test_live_draft.cpp -o /tmp/ownrt-live-draft
          /tmp/ownrt-live-draft
      - name: Native two-slot ring without device access
        working-directory: experiments/own-xpu-runtime
        run: |
          g++ -std=c++20 -O1 -I engine/src engine/planning/test_native_ring_control.cpp -lcrypto -o /tmp/ownrt-ring-control
          /tmp/ownrt-ring-control
          g++ -std=c++20 -O1 -I engine/src engine/planning/test_native_ring_wire.cpp -lcrypto -o /tmp/ownrt-ring-wire
          /tmp/ownrt-ring-wire
          g++ -std=c++20 -O1 -DOWN_RT_HOST_ONLY -ffunction-sections -fdata-sections -I engine/src engine/planning/test_native_ring_checkpoint.cpp engine/src/stage2/packet194-expert-diet-engine/owner.cpp -Wl,--gc-sections -lcrypto -pthread -o /tmp/ownrt-ring-checkpoint
          /tmp/ownrt-ring-checkpoint /tmp/ownrt-ring-checkpoint-output
