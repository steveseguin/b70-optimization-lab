name: publish-site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest tools/test_stage_pages.py
      - name: Stage the site and linked evidence
        run: >-
          python3 tools/stage-pages.py
          --output "$RUNNER_TEMP/neural-download"
          --report "$RUNNER_TEMP/pages-report.json"
          --max-bytes 900000000
      - name: Retain the file inventory and historical-link warnings
        uses: actions/upload-artifact@v4
        with:
          name: pages-inventory
          path: ${{ runner.temp }}/pages-report.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/neural-download

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
