name: local-worker
on:
  pull_request:
    paths: ['worker/**', '.github/workflows/local-worker.yml']
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/local-worker.yml']
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.lock
      - run: python -m pip install --require-hashes -r worker/requirements.lock
      - run: python -m unittest discover -s worker -p 'test_*.py'
