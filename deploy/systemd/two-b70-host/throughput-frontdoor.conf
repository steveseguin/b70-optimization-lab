[Service]
# keep the LAN proxy off earlyoom's victim list (it prefers python processes)
OOMScoreAdjust=-900
Environment=FRONTDOOR_BACKEND_URL=http://127.0.0.1:19350
Environment=FRONTDOOR_BACKEND_URLS=http://127.0.0.1:19350,http://127.0.0.1:19351
Environment=FRONTDOOR_BACKEND_CAPACITIES=8,8
Environment=FRONTDOOR_BACKEND_CONTEXT_TOKENS=4096,4096
Environment=FRONTDOOR_MAX_ACTIVE_GENERATIONS=16
Environment=FRONTDOOR_CONTEXT_TOKENS_PER_REQUEST=4096
Environment=FRONTDOOR_TOTAL_CONTEXT_TOKENS_PER_BACKEND=32768
Environment=FRONTDOOR_RECOMMENDED_MAX_OUTPUT_TOKENS=1024
Environment=FRONTDOOR_PROMPT_CACHE_RAM_MIB=512
Environment=FRONTDOOR_SPECULATION=none
Environment=FRONTDOOR_PUBLIC_BASE_URL_HINT=http://192.168.2.45:8000/v1
Environment=FRONTDOOR_SLOT_PROFILE=throughput-ctx32768-parallel8-4k-slots-nospec-2gpu
Environment=FRONTDOOR_REJECT_JSON_FIELDS=logprobs,top_logprobs
