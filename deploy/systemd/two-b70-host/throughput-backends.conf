# recipe: throughput  (max total tokens/s for many concurrent API clients; 8 slots x 4K per card = 16 concurrent, no speculation)
# Two-B70 host (192.168.2.45). Measured 2026-10-10 (one card, closed loop, 300-token prompts / 150-token answers):
#   8 x 4K no-draft 626 total tok/s  vs  4 x 16K draft-1 590  vs  8 x 4K draft-1 (16-token path) 490.
# No speculation: 8 sequences x 1 token = 8 tokens per step, the limit of the fast MoE kernels. Requests over 4K tokens
# are rejected by the frontdoor (413); switch to the 'balanced' or 'single' recipe for longer contexts.
[Service]
Environment="GPU_INDICES=1 0"
Environment=START_STAGGER_S=60
Environment=CTX_SIZE=32768
Environment=PARALLEL=8
Environment=CACHE_RAM_MIB=512
Environment=LLAMA_PREFILL_UBATCH_SIZE=1024
Environment=GGML_SYCL_DNNL_DETERMINISTIC=1
Environment=LLAMA_SERVER=/home/steve/src/llama.cpp-gemma-c926-oneapi2026.1-compat/build-sycl-b70-aot-bmg-g31-q8reorder-vdr2/bin/llama-server
Environment=OUT_DIR=/mnt/fast-ai/bench-results/gemma4-26b-a4b-q8/servers
Environment="EXTRA_LLAMA_ARGS=--parallel 8 --cache-ram 512 --ctx-checkpoints 2"
