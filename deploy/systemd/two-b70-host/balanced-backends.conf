# recipe: balanced  (4 slots x 16K per card = 8 concurrent, draft length 1; the default LAN shape)
# Two-B70 host (192.168.2.45), 16K-context LAN service shape chosen 2026-10-09/10.
# Host oneAPI 2026.1 compat build (gate-passed 2026-09-07). Card order "1 0": card 0 (PCI 03:00.0) hung once at load
# on the 6-day-old boot, so the untouched card loads first and the second start is delayed by START_STAGGER_S.
#
# Shape: 4 slots x 16384 tokens per card (CTX_SIZE 65536 total / PARALLEL 4) = 8 concurrent generations on two cards.
#   - MTP draft length 1 (n_max=n_min=1): the fast MoE kernels accept at most 8 tokens per step, 4 slots x 2 tokens = 8.
#     With the record draft length 3, 3+ active slots fall off the fast path (per-stream 28 tok/s instead of 55).
#   - LLAMA_PREFILL_UBATCH_SIZE 1024 (not 2048): shrinks the per-slot sliding-window cache so 4 slots fit with headroom
#     (30.3 GB used of 32.6 GB; 2048 needed 31.4 GB and the VMM pool ran out under 4 concurrent prompts).
#   - GGML_SYCL_DNNL_DETERMINISTIC=1: stock oneDNN matmul is not run-to-run deterministic on this card; this env switch
#     (one-line patch in ggml/src/ggml-sycl/gemm.hpp of the compat build, 2026-10-09) sets dnnl primitive_attr
#     set_deterministic(true). Cold repeats then match (6/6, 4/4, 3/3) at ~3% cost; GGML_SYCL_DISABLE_DNN=1 also works
#     but costs ~8-10%.
#   - --ctx-checkpoints 8 (CKPT): enables prompt-cache reuse for multi-turn chats on this SWA model (turn-2 TTFT 0.4 s
#     instead of 4.4 s at 6K context). CACHE_RAM_MIB 2048 per card on this 15 GiB host.
[Service]
Environment="GPU_INDICES=1 0"
Environment=START_STAGGER_S=60
Environment=CTX_SIZE=65536
Environment=PARALLEL=4
Environment=CACHE_RAM_MIB=2048
Environment=LLAMA_PREFILL_UBATCH_SIZE=1024
Environment=GGML_SYCL_DNNL_DETERMINISTIC=1
Environment=LLAMA_SERVER=/home/steve/src/llama.cpp-gemma-c926-oneapi2026.1-compat/build-sycl-b70-aot-bmg-g31-q8reorder-vdr2/bin/llama-server
Environment=OUT_DIR=/mnt/fast-ai/bench-results/gemma4-26b-a4b-q8/servers
Environment="EXTRA_LLAMA_ARGS=--parallel 4 --cache-ram 2048 --spec-type draft-mtp --spec-draft-model /mnt/fast-ai/llm-models/gemma4-26b-a4b-it-q8-gguf/MTP/gemma-4-26B-A4B-it-Q4_0-MTP.gguf --spec-draft-n-max 1 --spec-draft-device SYCL0 --spec-draft-ngl all --spec-draft-type-k f16 --spec-draft-type-v f16 --spec-draft-n-min 1 --spec-draft-p-min 0.0475 --no-spec-draft-backend-sampling --spec-draft-threads 32 --spec-draft-threads-batch 32 --ctx-checkpoints 8"
